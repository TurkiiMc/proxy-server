# Upload to TurkiiMc/proxy-server/.github/workflows/faisal-massive-shared-guard.yml
# Preview first. Apply edits app.py + source_diagnostics.py and adds massive_guard.py.
# Keeps Yahoo-first behavior, 5-minute watch cadence, signal conditions and Telegram unchanged.
name: Faisal - shared Massive rate guard

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview tests first; apply only after successful review"
        type: choice
        required: true
        default: preview
        options:
          - preview
          - apply

permissions:
  contents: write

concurrency:
  group: faisal-proxy-patch
  cancel-in-progress: false

jobs:
  massive-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout proxy-server
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Guard target repository and baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "TurkiiMc/proxy-server"
          test "$GITHUB_REF_NAME" = "main"
          test -f app.py
          test -f source_diagnostics.py
          grep -q 'def _massive_result(sym):' app.py
          grep -q 'FAISAL_MASSIVE_HTTP_AGE_DIAG_V2' source_diagnostics.py
          echo 'Guard OK; existing application and diagnostics will be preserved apart from Massive requests.'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install offline test dependency
        run: python -m pip install -q requests

      - name: Stage exact guarded patch (no deployment)
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/massive_guard.py <<'PY_GATE'
          """FAISAL_MASSIVE_SHARED_GATE_V1.

          One best-effort cross-worker rate budget shared by live /watch and the silent
          source diagnostic. Render Linux/one-instance local filesystem only. If shared
          state cannot be read/written, fail closed (skip Massive; keep Yahoo working).
          No tokens, URLs or credentials are written to disk or logs.
          """
          import json
          import os
          import time
          from pathlib import Path

          import requests


          def _state_file():
              base = os.environ.get('WATCH_STATE_FILE') or '/tmp/faisal_watch_state.json'
              return Path(base + '.massive_gate.json')


          def _int_env(name, default, lo, hi):
              try:
                  value = int(os.environ.get(name, default))
              except (TypeError, ValueError):
                  return default
              return min(hi, max(lo, value))


          def _edit(mutator, *, lock_nonblocking=False):
              """Atomic read/mutate/write under process-wide Linux flock."""
              import fcntl
              path = _state_file()
              path.parent.mkdir(parents=True, exist_ok=True)
              lock_path = str(path) + '.lock'
              with open(lock_path, 'a+', encoding='utf-8') as lock:
                  how = fcntl.LOCK_EX | (fcntl.LOCK_NB if lock_nonblocking else 0)
                  fcntl.flock(lock, how)
                  try:
                      with path.open(encoding='utf-8') as handle:
                          state = json.load(handle)
                          if not isinstance(state, dict):
                              raise ValueError('invalid Massive state')
                  except FileNotFoundError:
                      state = {}
                  result = mutator(state)
                  tmp = path.with_name(f'{path.name}.{os.getpid()}.{__import__("threading").get_ident()}.tmp')
                  try:
                      with tmp.open('w', encoding='utf-8') as handle:
                          json.dump(state, handle)
                      os.replace(tmp, path)
                  finally:
                      try:
                          tmp.unlink(missing_ok=True)
                      except OSError:
                          pass
                  return result


          def _reserve():
              now = time.time()
              limit = _int_env('MASSIVE_MAX_REQUESTS_PER_MIN', 4, 1, 60)

              def update(state):
                  if now < float(state.get('cooldown_until') or 0):
                      return '429_cooldown'
                  events = state.get('requests', [])
                  if not isinstance(events, list):
                      events = []
                  events = [t for t in events if isinstance(t, (float, int)) and 0 <= now - t < 60]
                  state['requests'] = events
                  if len(events) >= limit:
                      return 'minute_budget'
                  events.append(now)
                  state['requests'] = events
                  return 'allowed'

              try:
                  return _edit(update, lock_nonblocking=True)
              except Exception as exc:
                  # If the gate cannot protect the budget, do not bypass it.
                  print(f'[massive-gate] cannot reserve ({type(exc).__name__}); skipped')
                  return 'gate_unavailable'


          def _handle_429(response):
              pause = _int_env('MASSIVE_429_COOLDOWN_SEC', 180, 120, 900)
              try:
                  retry = float(response.headers.get('Retry-After', '0'))
                  if retry > pause:
                      pause = min(900, int(retry))
              except (AttributeError, ValueError, TypeError):
                  pass
              deadline = time.time() + pause

              def update(state):
                  state['cooldown_until'] = max(deadline, float(state.get('cooldown_until') or 0))
              try:
                  _edit(update)
              except Exception as exc:
                  print(f'[massive-gate] cannot save cooldown ({type(exc).__name__})')
              print(f'[massive-gate] HTTP 429; shared cooldown {pause}s')


          def guarded_get(url, *, params=None, timeout=12):
              """Return (HTTP response or None, reason). Uses guarded shared budget.

              A skipped request never means the symbol had no trades. The caller must
              never treat it as evidence of price freshness or execute trade decisions.
              """
              outcome = _reserve()
              if outcome != 'allowed':
                  return None, f'skipped_{outcome}'
              response = requests.get(url, params=params, timeout=timeout)
              if response.status_code == 429:
                  _handle_429(response)
              return response, f'http_{response.status_code}'
          PY_GATE
          if [ -f massive_guard.py ]; then
            cmp -s massive_guard.py /tmp/massive_guard.py || { echo 'Existing massive_guard.py differs; refusing overwrite'; exit 1; }
          else
            cp /tmp/massive_guard.py massive_guard.py
          fi
          cat > /tmp/faisal_massive_patch.py <<'PY_PATCH'
          """Patch only the live Massive fetch and separate diagnostic probe, fail closed."""
          from pathlib import Path
          import ast

          APP_MARK = 'FAISAL_MASSIVE_SHARED_GATE_V1'
          DIAG_MARK = 'FAISAL_MASSIVE_HTTP_AGE_DIAG_V2'
          app = Path('app.py')
          diag = Path('source_diagnostics.py')
          assert app.is_file() and diag.is_file(), 'Required app.py and source_diagnostics.py missing'
          a = app.read_text(encoding='utf-8')
          d = diag.read_text(encoding='utf-8')
          assert 'def _massive_result(sym):' in a, 'Unknown app version; stop'
          assert DIAG_MARK in d and 'def _massive_probe(sym, now):' in d, 'Install HTTP+age diagnostic first'
          assert 'def _run_sample(' in d and 'massive= ' not in d, 'Unknown diagnostics version'
          if APP_MARK in a or APP_MARK in d:
              if APP_MARK in a and APP_MARK in d and Path('massive_guard.py').is_file():
                  print('Shared Massive guard already applied; no changes needed')
                  raise SystemExit(0)
              raise SystemExit('Partial shared Massive patch detected: stop without changes')

          def replace_once(src, old, new, why):
              count = src.count(old)
              if count != 1:
                  raise RuntimeError(f'{why}: expected one match, got {count}; no files changed')
              return src.replace(old, new, 1)

          # Use the same budget/cooldown gate in the live fallback, without changing
          # Yahoo handling, _sessions(), signal criteria or Telegram notification logic.
          a = replace_once(a, 'MASSIVE_BASE = "https://api.massive.com"',
              f'# {APP_MARK}: shared Massive budget for live and diagnostics\nimport massive_guard as _massive_guard\nMASSIVE_BASE = "https://api.massive.com"',
              'live Massive module anchor')
          old = '''        r = requests.get(f"{MASSIVE_BASE}/v2/aggs/ticker/{_y(sym)}/range/5/minute/{frm}/{today}",
                                   params={"adjusted": "true", "sort": "asc", "limit": 5000, "apiKey": key}, timeout=20)
          '''
          new = '''        r, gate = _massive_guard.guarded_get(
                      f"{MASSIVE_BASE}/v2/aggs/ticker/{_y(sym)}/range/5/minute/{frm}/{today}",
                      params={"adjusted": "true", "sort": "asc", "limit": 5000, "apiKey": key}, timeout=20)
                  if r is None:
                      _mv_state["last_status"] = gate
                      return None
          '''
          a = replace_once(a, old, new, 'live Massive call')
          # Remove local per-worker 120s early-exit after 429: shared gate already
          # persists the cooldown across workers, and live telemetry remains intact.
          old = '''    if r.status_code == 429:                       # حد الطلبات: توقف دقيقتين
                  _mv_state["blocked_until"] = time.time() + 120; return None
          '''
          new = '''    if r.status_code == 429:
                  return None   # global cross-worker cooldown is owned by massive_guard
          '''
          a = replace_once(a, old, new, 'live Massive 429 branch')
          # Remove the local early check; the common gate now owns the cooldown.
          a = replace_once(a,
              '''    if not key or time.time() < _mv_state["blocked_until"]:
                  return None
          ''',
              '''    if not key:
                  return None
          ''', 'live legacy per-worker gate')

          # Diagnostics previously made its own unguarded request on every sampled
          # symbol, including two with fresh Yahoo prices. Reuse the SAME gate instead.
          d = replace_once(d, 'from zoneinfo import ZoneInfo\n',
              f'from zoneinfo import ZoneInfo\nimport massive_guard as _massive_guard  # {APP_MARK}\n', 'diagnostics import')
          old = '''        resp = requests.get(
                      f'https://api.massive.com/v2/aggs/ticker/{sym.replace(".", "-")}/range/5/minute/{start_day}/{day}',
                      params={'adjusted': 'true', 'sort': 'asc', 'limit': 5000, 'apiKey': key},
                      timeout=12,
                  )
                  code = int(resp.status_code)
          '''
          new = '''        resp, gate = _massive_guard.guarded_get(
                      f'https://api.massive.com/v2/aggs/ticker/{sym.replace(".", "-")}/range/5/minute/{start_day}/{day}',
                      params={'adjusted': 'true', 'sort': 'asc', 'limit': 5000, 'apiKey': key},
                      timeout=12,
                  )
                  if resp is None:
                      return gate, None  # Rate-limited skip, not evidence of no trades
                  code = int(resp.status_code)
          '''
          d = replace_once(d, old, new, 'diagnostics Massive request')
          old = '''        # Separate read-only diagnostic probe: preserves original /watch Massive fallback.
                  mstate, mage = _massive_probe(sym, now)
          '''
          new = '''        # Fresh Yahoo: do not spend a Massive API call on a redundant comparison.
                  if ystate == 'fresh':
                      mstate, mage = 'skipped_yahoo_fresh', None
                  else:
                      mstate, mage = _massive_probe(sym, now)
          '''
          d = replace_once(d, old, new, 'diagnostics probing policy')

          # No changes to the /watch interface, alerts, or order decisions.
          for filename, code in [('app.py', a), ('source_diagnostics.py', d)]:
              ast.parse(code, filename=filename)
          app.write_text(a, encoding='utf-8')
          diag.write_text(d, encoding='utf-8')
          print('Applied shared Massive rate/cooldown gate (live + diagnostics), no signal changes')
          PY_PATCH
          python /tmp/faisal_massive_patch.py
          python -m py_compile massive_guard.py source_diagnostics.py app.py
          git diff --check
          git status --short

      - name: Offline tests (shared quota / 429 / Yahoo fresh / no false bars)
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/test_shared_guard.py <<'PY_TEST'
          import contextlib
          import io
          import json
          import os
          import tempfile
          import time
          import sys
          import ast
          from pathlib import Path
          from unittest.mock import patch

          import massive_guard as gate
          import source_diagnostics as diag


          class FakeResponse:
              def __init__(self, status, **kwargs):
                  self.status_code = status
                  self.headers = kwargs.get('headers', {})
              def json(self):
                  return {'results': []}


          with tempfile.TemporaryDirectory() as tmp:
              with patch.dict(os.environ, {
                  'WATCH_STATE_FILE': str(Path(tmp) / 'watch.json'),
                  'MASSIVE_MAX_REQUESTS_PER_MIN': '4',
                  'MASSIVE_429_COOLDOWN_SEC': '180',
              }):
                  with patch.object(gate.requests, 'get', return_value=FakeResponse(200)) as req:
                      responses = [gate.guarded_get('https://api.massive.com/diagnostic', params={'apiKey': 'TOPSECRET'}) for _ in range(6)]
                      assert [r[1] for r in responses] == ['http_200']*4 + ['skipped_minute_budget']*2, responses
                      assert req.call_count == 4
                      assert 'TOPSECRET' not in gate._state_file().read_text()
                      print('OK: shared 4-request/min budget, no credentials persisted')

                  # Rate limit is shared and durable across instances: rewrite timed-out reservations.
                  state = json.loads(gate._state_file().read_text())
                  state['requests'] = []
                  gate._state_file().write_text(json.dumps(state))
                  with patch.object(gate.requests, 'get', return_value=FakeResponse(429, headers={'Retry-After': '240'})) as req:
                      r, reason = gate.guarded_get('https://api.massive.com/test')
                      assert reason == 'http_429'
                      r, reason = gate.guarded_get('https://api.massive.com/test')
                      assert r is None and reason == 'skipped_429_cooldown'
                      assert req.call_count == 1
                      assert json.loads(gate._state_file().read_text())['cooldown_until'] > time.time() + 220
                      print('OK: HTTP429 shared cooldown, honors bounded Retry-After')

                  # Diagnostics may not spend quota on Yahoo-fresh symbols.
                  calls=[]
                  def fake_chart(sym,*args):
                      return {'timestamp': [time.time()] if sym=='FRESH' else [time.time()-1800]}, None
                  def fake_sessions(res):
                      return {'last_ts': res['timestamp'][0], 'date': 'today'}
                  def fake_fresh(s):
                      return time.time() - s['last_ts'] <= 1200
                  def fake_probe(sym, now):
                      calls.append(sym)
                      return ('skipped_429_cooldown', None)
                  buf=io.StringIO()
                  with patch.object(diag, '_alpaca_latest', return_value=('ok', {'FRESH':'fresh', 'STALE':'stale'}, {'FRESH':2,'STALE':31})), patch.object(diag,'_massive_probe',side_effect=fake_probe), contextlib.redirect_stdout(buf):
                      diag._run_sample(['FRESH','STALE'], {'STALE'}, fake_chart, None, fake_sessions, fake_fresh)
                  assert calls == ['STALE'], calls
                  assert 'massive=skipped_yahoo_fresh' in buf.getvalue(), buf.getvalue()
                  assert 'massive=skipped_429_cooldown' in buf.getvalue()
                  print('OK: diagnostic skip for fresh Yahoo and explicit rate-limit status')

          # Compile just the live fallback function, to ensure it uses common gate and does
          # not call Massive if budget is exhausted (without importing the actual FastAPI app).
          tree = ast.parse(Path('app.py').read_text(encoding='utf-8'))
          fn = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == '_massive_result')
          ns={
           'os':os, 'time':time, 'timedelta':__import__('datetime').timedelta,
           '_ny_now': lambda: __import__('datetime').datetime.now(),
           '_y':lambda x:x,
           '_mv_state':{'blocked_until':0,'last_status':None},
           'MASSIVE_BASE':'https://api.massive.com',
          }
          class GuardStub:
              @staticmethod
              def guarded_get(*args,**kwargs):
                  return None, 'skipped_minute_budget'
          ns['_massive_guard']=GuardStub()
          exec(compile(ast.Module(body=[fn], type_ignores=[]),'<isolated_app>','exec'),ns)
          with patch.dict(os.environ, {'MASSIVE_API_KEY': 'dummy'}):
              assert ns['_massive_result']('MSFT') is None
              assert ns['_mv_state']['last_status'] == 'skipped_minute_budget'
          print('OK: live Massive fetch treats budget skip as unavailable, no false fresh bars')

          # Prohibit any non-fallback modification to signal/notification computation:
          assert 'if not _fresh(s):\n        mres = _massive_result(sym)' in Path('app.py').read_text()
          print('ALL_OFFLINE_TESTS_PASS')
          PY_TEST
          PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}" python /tmp/test_shared_guard.py

      - name: Prepare preview for review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/faisal-massive-preview
          git diff -- app.py source_diagnostics.py > /tmp/faisal-massive-preview/changes.patch
          cp massive_guard.py /tmp/faisal-massive-preview/massive_guard.py
          echo 'No live prices, trade decisions, watch interval, or Telegram rules changed.' > /tmp/faisal-massive-preview/README.txt

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: faisal-massive-guard-preview
          path: /tmp/faisal-massive-preview/

      - name: Apply guarded Massive calls (only when selected)
        if: ${{ success() && inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'faisal-watch-bot'
          git config user.email 'faisal-watch-bot@users.noreply.github.com'
          git add -- app.py source_diagnostics.py massive_guard.py
          if git diff --cached --quiet; then
            echo 'Already applied; no changes'
            exit 0
          fi
          git commit -m 'fix: share Massive request budget and 429 cooldown across watch and diagnostics'
          git push origin HEAD:main

      - name: Review only
        if: ${{ success() && inputs.mode == 'preview' }}
        run: |
          echo 'PREVIEW SUCCESS: no changes committed or deployed. Select apply after review.'
